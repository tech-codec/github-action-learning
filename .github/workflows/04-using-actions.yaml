name: 04 - Using Actions

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 04-using-actions/react-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Printing Folders
        run: tree

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test
